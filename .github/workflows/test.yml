name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./sast
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./secrets-scan
  deps-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./deps-scan
        with:
          path: .github
      - id: vulnerable
        uses: ./deps-scan
        continue-on-error: true
        with:
          path: test/vulnerable
      - name: The vulnerable lockfile fails the scan
        if: steps.vulnerable.outcome != 'failure'
        run: exit 1
